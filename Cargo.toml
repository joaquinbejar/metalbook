[workspace]
members = ["metalbook-core", "metalbook-program", "metalbook-tests", "metalbook-maker", "metalbook-keeper", "lint-control"]
resolver = "2"

[workspace.package]
version = "0.1.0"
edition = "2021"
authors = ["Joaquin Bejar <jb@taunais.com>"]
license = "MIT"
repository = "https://github.com/joaquinbejar/metalbook"

[workspace.dependencies]
# Versions checked on crates.io (max_stable_version) on 2026-10-29.
proptest = "1.12"
bytemuck = { version = "1.25", default-features = false, features = ["derive", "min_const_generics"] }
metalbook-core = { path = "metalbook-core", version = "0.1" }
metalbook-maker = { path = "metalbook-maker" }
metalbook-keeper = { path = "metalbook-keeper" }
# Pinocchio 0.11 generation: decided exception to the latest-stable rule (docs/PLAN.md,
# Dependencies). pinocchio-token 0.7 and pinocchio-associated-token-account 0.4 are the
# newest releases built on solana-account-view 2.
pinocchio = { version = "0.11", default-features = false, features = ["cpi", "sha2"] }
pinocchio-system = "0.6"
pinocchio-token = "0.7"
pinocchio-associated-token-account = "0.4"
# Unpublished sibling: varswap's pyth-lite, pinned by rev (rules/global_rules.md).
pyth-lite = { git = "https://github.com/joaquinbejar/varswap", rev = "5cf95aa97ef01b0c4a540327f1501c8dcb7a7811" }
# Unpublished siblings: quotebook-core and quotebook-sdk, pinned to the same rev (quotebook
# main with the M5 taker SDK).
quotebook-core = { git = "https://github.com/joaquinbejar/quotebook", rev = "578314c6ae03a3ab9ea4b045cfed60fa442ae607" }
quotebook-sdk = { git = "https://github.com/joaquinbejar/quotebook", rev = "578314c6ae03a3ab9ea4b045cfed60fa442ae607" }
# Off-chain only (metalbook-maker, metalbook-keeper). Versions checked on crates.io on 2026-10-29.
# metalbook-keeper's Hermes client: one blocking HTTP crate, TLS through rustls (ring, webpki
# roots), no native TLS. ureq 3.5.0, serde 1.0.229, serde_json 1.0.154, base64 0.23.1.
ureq = { version = "3.5", default-features = false, features = ["rustls"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
base64 = "0.23"
rust_decimal = "1.43"
thiserror = "2.0"
# metalbook-maker tests only: the independent pricing reference.
optionstratlib = "0.23"
rust_decimal_macros = "1.40"
# metalbook-tests only: LiteSVM 0.18.1 (latest) pins these generations of the Solana client
# crates; same approved exception as optfix.
litesvm = "0.18"
litesvm-token = "0.18"
solana-account = "4.3"
solana-address = "2.7"
solana-clock = "3.2"
solana-instruction = "3.5"
solana-keypair = "3.1"
solana-signer = "3.0"
solana-transaction = "4.3"

[workspace.lints.rust]
unsafe_code = "deny"
missing_docs = "deny"
# Pinocchio's entrypoint macros test `target_os = "solana"`; `lint_control` is set only by
# `make lint-control`.
unexpected_cfgs = { level = "warn", check-cfg = [
    'cfg(target_os, values("solana"))',
    'cfg(lint_control)',
] }

[workspace.lints.clippy]
panic = "deny"
unwrap_used = "deny"
expect_used = "deny"
unreachable = "deny"
todo = "deny"
unimplemented = "deny"
indexing_slicing = "deny"
arithmetic_side_effects = "deny"
integer_division = "deny"
float_arithmetic = "deny"
panic_in_result_fn = "deny"
manual_assert = "deny"
disallowed_macros = "deny"          # list in clippy.toml

[profile.release]
overflow-checks = true
codegen-units = 1
lto = "fat"
