# Fuzz targets (docs/PLAN-improvements.md, milestone H5). Outside the repository workspace:
# cargo-fuzz needs nightly and libFuzzer, which the workspace does not. Run with `make fuzz`
# (every target for FUZZ_SECONDS each) or `cargo +nightly fuzz run <target>` from the repo root.
# The harness logic lives in fuzz/harness/ and is also compiled by the stable regression test
# metalbook-tests/tests/fuzz_regressions.rs, which replays fuzz/regressions/<target>/.
# Versions checked on crates.io on 2026-11-02: libfuzzer-sys 0.4.13, arbitrary 1.5.0. The
# Solana crates are the LiteSVM generation the workspace uses (root Cargo.toml).
[package]
name = "metalbook-fuzz"
version = "0.0.0"
edition = "2021"
publish = false
license = "MIT"

[package.metadata]
cargo-fuzz = true

[dependencies]
libfuzzer-sys = "0.4"
arbitrary = { version = "1.5", features = ["derive"] }
metalbook-core = { path = "../metalbook-core" }
bytemuck = "1.25"
litesvm = "0.18"
litesvm-token = "0.18"
solana-account = "4.3"
solana-address = { version = "2.7", features = ["curve25519"] }
solana-clock = "3.2"
solana-instruction = "3.5"
solana-keypair = "3.1"
solana-signer = "3.0"
solana-transaction = "4.3"

# Its own workspace, so the repository workspace never builds it on stable.
[workspace]
members = ["."]

[profile.release]
debug = 1
overflow-checks = true

[[bin]]
name = "settlement_model"
path = "fuzz_targets/settlement_model.rs"
test = false
doc = false
bench = false

[[bin]]
name = "sample_settlement"
path = "fuzz_targets/sample_settlement.rs"
test = false
doc = false
bench = false

[[bin]]
name = "ledger_sequence"
path = "fuzz_targets/ledger_sequence.rs"
test = false
doc = false
bench = false
