# CI for metalbook (docs/PLAN-improvements.md, milestone H1), copied from optfix's milestone 9:
# `make pre-push` and `make bench` on pinned toolchains, so the committed docs/benchmarks.md is
# reproduced exactly.
#
# `make pre-push` takes 84 s cold on the Studio (2026-11-02), so it runs as one job (`pre-push`)
# next to `bench`; a step fails if the `pre-push` prerequisites change without this workflow.
# Two targets use the network: `quotebook-program` clones quotebook's tag v0.1.0 (pinned by
# commit in the Makefile) and `pyth-programs` dumps the Pyth receiver and Wormhole from devnet
# (pinned by SHA-256 in the Makefile; cached here by those hashes, so a cache hit skips the
# dump and a mismatch fails).
#
# Pins (bump each in its own PR, with the bench table regenerated):
# - Agave CLI 4.4.0 release tarball, which bundles cargo-build-sbf 4.5.0;
# - platform-tools v1.57 (Rust 1.95.0 for SBF), installed from its verified archive;
# - host Rust 1.99.1 with rustfmt and clippy.
# SHA-256 values are the digests GitHub publishes for the release assets (as in optfix).

name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  RUST_PIN: "1.99.1"
  AGAVE_VERSION: "v4.4.0"
  AGAVE_SHA256: "3363f4728fe786ac7036e342a20df928aa2e3e43f807fbdce67814840538c574"
  PLATFORM_TOOLS_VERSION: "v1.57"
  PLATFORM_TOOLS_SHA256: "b0f7af104adf726fff2a6a09ea2eb2f2d2965c92295f4d7388c08d140e0c2b00"
  CARGO_TERM_COLOR: never
  MAKE_PINS: RUST_TOOLCHAIN=1.99.1 CARGO_FLAGS=--locked

jobs:
  pre-push:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/actions/toolchains
      - uses: ./.github/actions/pyth-programs
      - name: make pre-push
        run: make $MAKE_PINS pre-push
      - name: this job runs exactly make pre-push
        run: |
          want="fmt-check lint lint-control program-control verifiable-control program quotebook-program pyth-programs test doc"
          got=$(sed -n 's/^pre-push: //p' Makefile)
          [ "$got" = "$want" ] || { echo "pre-push is '$got'; update this workflow"; exit 1; }

  bench:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/actions/toolchains
      - run: make $MAKE_PINS bench
      - name: docs/benchmarks.md is the committed one
        run: git diff --exit-code docs/benchmarks.md
