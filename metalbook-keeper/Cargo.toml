[package]
name = "metalbook-keeper"
description = "Off-chain settlement keeper for metalbook: posts every canonical candidate within the challenge delay and settles"
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true
repository.workspace = true
publish = false

[dependencies]
metalbook-core = { workspace = true }
# The LiteSVM generation, as metalbook-sdk (docs/PLAN.md exception): receiver posting builds
# instructions and derives PDAs off-chain.
solana-address = { workspace = true, features = ["curve25519", "decode"] }
solana-instruction = { workspace = true }
thiserror = { workspace = true }
base64 = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
ureq = { workspace = true }

[lints]
workspace = true
