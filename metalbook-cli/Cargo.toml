[package]
name = "metalbook-cli"
description = "Thin admin CLI for metalbook: the admin and listing instructions over JSON-RPC, and account reads"
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true
repository.workspace = true
publish = false

[[bin]]
name = "metalbook-admin"
path = "src/main.rs"

[[bin]]
name = "metalbook-keeper"
path = "src/bin/keeper.rs"
# Its name matches the metalbook-keeper library, whose documentation page it would overwrite.
doc = false

[dependencies]
metalbook-sdk = { workspace = true }
metalbook-keeper = { workspace = true }
pyth-post = { workspace = true }
# The generation metalbook-sdk builds instructions with (LiteSVM's, docs/PLAN.md exception).
solana-address = { workspace = true, features = ["decode"] }
solana-instruction = { workspace = true }
# `wincode` is the feature that gates `try_sign`; declared rather than left to unification.
solana-transaction = { workspace = true, features = ["wincode"] }
solana-keypair = { workspace = true }
solana-signer = { workspace = true }
solana-hash = { workspace = true, features = ["decode"] }
solana-rpc-client = { workspace = true }
solana-rpc-client-api = { workspace = true }
solana-commitment-config = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
thiserror = { workspace = true }
clap = { workspace = true }


[dev-dependencies]
base64 = { workspace = true }

[lints]
workspace = true
